name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/Manifest.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '9.0'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/ThallyAce/device-tecno-lc6'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'fox_9.0'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/tecno/lc6'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL'
        required: false
        default: ''
      COMMON_TREE_BRANCH:
        description: 'COMMON_TREE_BRANCH'
        required: false
        default: 'fox_9.0'
      COMMON_TREE_PATH:
        description: 'COMMON_TREE_PATH (e.g., device/tecno/common)'
        required: false
        default: ''

env:
  # Forces JS actions to run on Node 24, silencing the Node 20 warning
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04 # Pinned to avoid the Ubuntu 26 migration notice
    steps:
      # Updated to v5 to support Node 24 natively
      - name: Checkout
        uses: actions/checkout@v5

      # Updated to v5 to eliminate the Java deprecation warning
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Setup Repo and Sync Sources
        run: |
          # Create bin directory for repo
          mkdir -p ~/bin
          # Download repo tool
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          
          # Init repo (using your inputs)
          repo init --depth=1 -u ${{ github.event.inputs.SYNC_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
          
          # Sync the sources
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Trees
        run: |
          # Clone main device tree
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}
          
          # Clone common tree if the URL is provided
          if [ -n "${{ github.event.inputs.COMMON_TREE_URL }}" ] && [ -n "${{ github.event.inputs.COMMON_TREE_PATH }}" ]; then
            git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.COMMON_TREE_BRANCH }} ${{ github.event.inputs.COMMON_TREE_PATH }}
          fi

      - name: Build Recovery
        run: |
          export PATH=~/bin:$PATH
          export ALLOW_MISSING_DEPENDENCIES=true
          
          # Initialize the build environment
          source build/envsetup.sh
          
          # Set the lunch target (Assuming 'fox_lc6-eng' based on your device tree name)
          lunch fox_lc6-eng
          
          # Build the recovery image
          mka recoveryimage

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Recovery-Image
          # The output path is usually out/target/product/<device_codename>/
          path: out/target/product/lc6/recovery.img
          if-no-files-found: error

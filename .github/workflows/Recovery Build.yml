name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/Manifest.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '9.0'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/ThallyAce/device-tecno-lc6'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'fox_9.0'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/tecno/lc6'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL'
        required: false
        default: ''

env:
  # Forces JS actions to run on Node 24, silencing the Node 20 warning
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Use a version of checkout that supports Node 24
      - name: Checkout
        uses: actions/checkout@v4.2.0

      # Corrected Java setup (v4, with distribution specified)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # --- Your build steps go here ---
      # Example: Sync sources
      - name: Sync Sources
        run: |
          # Insert your sync commands here using ${{ github.event.inputs.SYNC_URL }} etc.
          echo "Syncing..."

      # Example: Build
      - name: Build Recovery
        run: |
          # Insert your lunch/make commands here
          echo "Building..."
